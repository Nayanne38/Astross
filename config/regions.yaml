# Pilot regions. bbox = [west, south, east, north] in WGS84 degrees.
# `default_region` in config/settings.yaml chooses which one the pipeline runs.
regions:
  matopiba:
    name: "Cerrado — Matopiba"
    name_en: "Cerrado — Matopiba"
    group: "Brasil"
    bbox: [-50.8, -15.3, -41.8, -2.2]
    timezone_offset_hours: -3
  sample_tocantins:
    # Small box used by the bundled SYNTHETIC sample (data/sample). Offline tests/demo only.
    name: "Amostra sintética — Tocantins"
    synthetic: true
    bbox: [-49.0, -11.0, -47.0, -9.0]
    timezone_offset_hours: -3

  # ---- Global monitoring tier ("live"): NASA FIRMS near-real-time only (last 1-5 days), no history in the DB.
  # The full harmonized series (calendar, harmonization, forecast, CSV) exists for the regions above.
  brasil_amazonia: {name: "Amazônia Legal", name_en: "Legal Amazon", group: "Brasil", live: true, bbox: [-74.0, -18.0, -44.0, 5.0]}
  brasil_pantanal: {name: "Pantanal", name_en: "Pantanal", group: "Brasil", live: true, bbox: [-59.5, -22.5, -54.5, -15.5]}
  brasil_sul: {name: "Sul e Mata Atlântica", name_en: "South and Atlantic Forest", group: "Brasil", live: true, bbox: [-57.7, -33.8, -39.0, -19.0]}
  brasil_nordeste: {name: "Nordeste e Caatinga", name_en: "Northeast and Caatinga", group: "Brasil", live: true, bbox: [-48.0, -18.5, -34.5, -1.0]}
