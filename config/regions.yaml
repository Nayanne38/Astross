  canada_boreal: {name: "Canadá: floresta boreal", name_en: "Canada: boreal forest", group: "Américas", live: true, bbox: [-130.0, 48.0, -90.0, 62.0]}
  mexico_central_america: {name: "México e América Central", name_en: "Mexico and Central America", group: "Américas", live: true, bbox: [-118.0, 8.0, -84.0, 33.0]}
  bolivia_chaco: {name: "Bolívia, Paraguai e Chaco", name_en: "Bolivia, Paraguay and the Chaco", group: "Américas", live: true, bbox: [-70.0, -29.0, -54.0, -9.0]}
