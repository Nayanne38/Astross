# Pilot regions. bbox = [west, south, east, north] in WGS84 degrees.
# `default_region` in config/settings.yaml chooses which one the pipeline runs.
regions:
  matopiba:
    name: "Cerrado — Matopiba"
    bbox: [-50.8, -15.3, -41.8, -2.2]
    timezone_offset_hours: -3
  sample_tocantins:
    # Small box used by the bundled SYNTHETIC sample (data/sample). Offline tests/demo only.
    name: "Amostra sintética — Tocantins"
    bbox: [-49.0, -11.0, -47.0, -9.0]
    timezone_offset_hours: -3
