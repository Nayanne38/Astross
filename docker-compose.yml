services:
  db:
    image: postgis/postgis:16-3.4
    container_name: queimadas-db
    environment:
      POSTGRES_USER: queimadas
      POSTGRES_PASSWORD: queimadas
      POSTGRES_DB: queimadas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queimadas"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
