# Always-on services for a small VM: Telegram alert bot + rolling 30-day FIRMS worker.
# Usage: docker compose -f deploy/docker-compose.vm.yml --env-file .env up -d --build
services:
  bot:
    build: ..
    command: python -m alerts.bot
    env_file: ../.env
    restart: always
  worker:
    build: ..
    command: python -m etl.worker --loop
    env_file: ../.env
    restart: always
