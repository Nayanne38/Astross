# Publishes the static export of the web app to GitHub Pages: https://<user>.github.io/Astross/
# One-time: repo Settings -> Pages -> Source: "GitHub Actions"; Settings -> Variables -> Actions ->
# NEXT_PUBLIC_API_URL = public HTTPS address of the FastAPI backend (no trailing slash).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    env:
      GH_PAGES: "1"
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: /Astross
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: node scripts/prepare-pages.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
