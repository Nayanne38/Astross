# Historical series for every region (free FIRMS country archives -> Supabase). Skips regions already loaded.
# Run it from the Actions tab (workflow_dispatch). A job lasts at most 6 h; run it again to continue.
name: History series
on:
  workflow_dispatch:
    inputs:
      region: { description: "Region key, or empty for all", required: false, default: "" }
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DB_BACKEND: supabase
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - run: |
          if [ -n "$REGION" ]; then python -m etl.pipelines.lite --region "$REGION"; else python -m etl.pipelines.lite --all; fi
