# Fire alert scan every 5 minutes (replaces the always-on bot loop). The Telegram commands are answered by the
# webhook on the API (api/telegram_hook.py), so nothing runs on anyone's PC.
# Secrets (Settings -> Secrets and variables -> Actions): DATABASE_URL, FIRMS_MAP_KEY, TELEGRAM_BOT_TOKEN
name: Fire alert scan
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
concurrency: { group: alert-scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_BACKEND: supabase
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      APP_PUBLIC_URL: https://nayanne38.github.io/FireTrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m alerts.bot --scan
